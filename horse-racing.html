
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Horse Racing Challenge</title>

<style>
/* COLLAPSIBLE RACE SETTINGS */

.settings-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.settings-heading h2 {
  margin: 0;
}

.gear-button {
  background: #ede9fe;
  color: #5b21b6;
  border: 2px solid #c4b5fd;
  padding: 10px 16px;
  border-radius: 10px;
  white-space: nowrap;
}

.gear-button:hover {
  background: #ddd6fe;
}

.settings-content {
  margin-top: 18px;
  padding-top: 15px;
  border-top: 1px solid #ddd6fe;
}

.settings-content.hidden {
  display: none;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #172554, #312e81, #581c87);
  color: white;
  min-height: 100vh;
}

header {
  text-align: center;
  padding: 22px 12px;
}

header h1 {
  margin: 0;
  font-size: clamp(27px, 5vw, 42px);
}

header p { color: #ddd6fe; }

.container {
  width: min(1100px, 94%);
  margin: auto;
  padding-bottom: 35px;
}

.panel {
  background: white;
  color: #1e1b4b;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 8px 25px #0003;
}

.settings {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 7px;
}

select, input {
  width: 100%;
  padding: 12px;
  border: 2px solid #c4b5fd;
  border-radius: 9px;
  font-size: 16px;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 13px 20px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}

button:hover:not(:disabled) {
  transform: translateY(-2px);
  filter: brightness(1.08);
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.primary {
  background: #7c3aed;
  color: white;
}

.green {
  background: #16a34a;
  color: white;
}

.orange {
  background: #ea580c;
  color: white;
}

.track {
  background: #bbf7d0;
  border: 5px solid #166534;
  border-radius: 15px;
  padding: 12px;
  overflow: hidden;
}

.lane {
  position: relative;
  height: 57px;
  background: repeating-linear-gradient(
    90deg, #86efac 0 45px, #a7f3d0 45px 90px
  );
  border-bottom: 2px dashed #15803d;
  margin-bottom: 5px;
  border-radius: 6px;
}

.lane:last-child { border-bottom: 0; }

.horse {
  position: absolute;
  left: 0;
  top: 5px;
  font-size: 36px;
  transition: left 1s cubic-bezier(.2,.8,.3,1);
  z-index: 2;
  transform: scaleX(-1);
}

.horse-name {
  position: absolute;
  left: 7px;
  top: 36px;
  color: #14532d;
  font-size: 11px;
  font-weight: bold;
}

.finish {
  position: absolute;
  right: 0;
  top: 0;
  bottom: 0;
  width: 25px;
  background: repeating-conic-gradient(#111 0% 25%, white 0% 50%) 0 / 15px 15px;
  border-left: 3px solid #111;
}

.current {
  outline: 3px solid #f59e0b;
  outline-offset: -3px;
}

.question-box {
  text-align: center;
}

.question {
  font-size: clamp(19px, 3vw, 27px);
  font-weight: bold;
  line-height: 1.5;
  margin: 20px 0;
}

.base-word {
  display: inline-block;
  background: #ede9fe;
  color: #6d28d9;
  padding: 10px 22px;
  border-radius: 10px;
  font-size: 23px;
  font-weight: bold;
  letter-spacing: 2px;
}

.answer-area {
  display: flex;
  gap: 10px;
  max-width: 600px;
  margin: 15px auto;
}

.answer-area input { flex: 1; }

.feedback {
  min-height: 30px;
  font-weight: bold;
  margin: 12px;
}

.dice-area {
  text-align: center;
  padding: 20px;
}

.dice {
  font-size: 100px;
  display: inline-block;
  line-height: 1.3;
  filter: drop-shadow(0 8px 5px #0004);
}

.rolling {
  animation: tumble .65s ease-in-out infinite;
}

@keyframes tumble {
  0% { transform: rotate(0deg) scale(1); }
  25% { transform: rotate(90deg) scale(1.15); }
  50% { transform: rotate(180deg) scale(.9); }
  75% { transform: rotate(270deg) scale(1.15); }
  100% { transform: rotate(360deg) scale(1); }
}

.scoreboard {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 10px;
}

.score {
  background: #f3f0ff;
  padding: 12px;
  border-radius: 10px;
  text-align: center;
  border: 2px solid #ddd6fe;
}

.score.active {
  border-color: #f59e0b;
  background: #fef3c7;
}

.score strong {
  display: block;
  font-size: 18px;
  margin: 5px;
}

.hidden { display: none !important; }

#result {
  text-align: center;
  font-size: 27px;
  font-weight: bold;
  color: #7c3aed;
  padding: 15px;
}

@media(max-width: 550px) {
  .answer-area { flex-direction: column; }
  .horse { font-size: 30px; }
  .lane { height: 53px; }
}
</style>
</head>

<body>

<header>
  <h1>🏇 English Horse Racing Challenge</h1>
  <p>Answer correctly, roll the dice and race to victory!</p>
</header>

<div class="container">

<section class="panel settings-panel">

  <div class="settings-heading">
    <h2>🏁 Race Control</h2>

    <button id="settingsToggle"
            class="gear-button"
            aria-expanded="false"
            aria-controls="settingsContent"
            title="Open race settings">
      ⚙️ Settings
    </button>
  </div>

  <div id="settingsContent" class="settings-content hidden">

    <div class="settings">
      <div>
        <label for="playerCount">Number of players / teams</label>
        <select id="playerCount">
          <option value="2">2 players</option>
          <option value="3">3 players</option>
          <option value="4">4 players</option>
          <option value="5">5 players</option>
          <option value="6">6 players</option>
        </select>
      </div>

      <div>
        <label for="categorySelect">Question category</label>
        <select id="categorySelect"></select>
      </div>

      <div>
        <label for="setSelect">Question set</label>
        <select id="setSelect"></select>
      </div>

      <div>
        <label for="raceLength">Race length</label>
        <select id="raceLength">
          <option value="20">20 spaces</option>
          <option value="30" selected>30 spaces</option>
          <option value="40">40 spaces</option>
        </select>
      </div>
    </div>

    <p>
      <button class="primary" id="startButton">
        🏁 Start New Race
      </button>
    </p>

  </div>
</section>

<section class="panel">
  <h2>🏆 The Race Track</h2>
  <div id="track" class="track">
    <p style="color:#166534">Start a race to prepare the horses!</p>
  </div>
</section>

<section class="panel question-box">
  <h2>🧠 Question Challenge</h2>

  <p id="turnLabel">Start a new race to begin.</p>

  <div id="questionArea" class="hidden">
    <div class="question" id="questionText"></div>

    <p>Change this base word:</p>
    <div class="base-word" id="baseWord"></div>

    <div class="answer-area">
      <input id="answerInput" type="text"
        placeholder="Type your answer here"
        autocomplete="off">
      <button class="primary" id="submitAnswer">Submit</button>
    </div>

    <div class="feedback" id="feedback"></div>

    <button class="orange hidden" id="nextTurn">
      Next Player →
    </button>
  </div>
</section>

<section class="panel dice-area">
  <h2>🎲 Dice Roller</h2>
  <div class="dice" id="dice">⚀</div>
  <p id="diceMessage">Answer correctly to unlock the dice!</p>
  <button class="green" id="rollButton" disabled>🎲 Roll Dice</button>
</section>

<div id="result"></div>

</div>

<script src="question-sets.js"></script>

<script>
const horses = ["🐎", "🐴", "🏇", "🐎", "🐴", "🏇"];
const diceFaces = ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];

let players = [];
let currentPlayer = 0;
let questions = [];
let questionIndex = 0;
let raceLength = 30;
let canRoll = false;
let raceOver = true;
let gameStarted = false;

const $ = id => document.getElementById(id);

function shuffle(array) {
  return [...array].sort(() => Math.random() - 0.5);
}

// LOAD CATEGORIES FROM THE SEPARATE QUESTION FILE
function loadCategories() {
  const categorySelect = $("categorySelect");
  categorySelect.innerHTML = "";

  if (typeof questionBank === "undefined") {
    categorySelect.innerHTML =
      '<option value="">Question bank not found</option>';
    return;
  }

  Object.keys(questionBank).forEach(key => {
    const option = document.createElement("option");
    option.value = key;
    option.textContent = questionBank[key].name;
    categorySelect.appendChild(option);
  });

  loadSets();
}

function loadSets() {
  const category = $("categorySelect").value;
  const setSelect = $("setSelect");
  setSelect.innerHTML = "";

  const sets = questionBank[category].sets;

  Object.keys(sets).forEach(key => {
    const option = document.createElement("option");
    option.value = key;
    option.textContent = sets[key].name;
    setSelect.appendChild(option);
  });
}

$("categorySelect").addEventListener("change", loadSets);

// CREATE PLAYERS
function createPlayers() {
  const count = Number($("playerCount").value);

  players = Array.from({ length: count }, (_, i) => ({
    name: "Player " + (i + 1),
    horse: horses[i],
    position: 0
  }));
}

// DRAW THE TRACK
function drawTrack() {
  const track = $("track");
  track.innerHTML = "";

  players.forEach((player, i) => {
    const lane = document.createElement("div");
    lane.className = "lane" + (i === currentPlayer ? " current" : "");

    const horse = document.createElement("div");
    horse.className = "horse";
    horse.textContent = player.horse;
    horse.style.left =
      `calc(${Math.min(player.position / raceLength * 100, 100)}% - 12px)`;

    const name = document.createElement("div");
    name.className = "horse-name";
    name.textContent = player.name;

    const finish = document.createElement("div");
    finish.className = "finish";

    lane.append(horse, name, finish);
    track.appendChild(lane);
  });
}

// LOAD A QUESTION
function loadQuestion() {
  if (questionIndex >= questions.length) {
    questions = shuffle(questions);
    questionIndex = 0;
  }

  const q = questions[questionIndex];
  questionIndex++;

  $("questionText").textContent = q.sentence;
  $("baseWord").textContent = q.baseWord;
  $("answerInput").value = "";
  $("feedback").textContent = "";
  $("answerInput").disabled = false;
  $("submitAnswer").disabled = false;
  $("nextTurn").classList.add("hidden");

  $("rollButton").disabled = true;
  $("diceMessage").textContent = "Answer correctly to unlock the dice!";
  $("dice").textContent = "⚀";

  canRoll = false;
}

// START A NEW RACE
function startRace() {
  const category = $("categorySelect").value;
  const setName = $("setSelect").value;

  if (!category || !setName) {
    alert("Please select a question category and set.");
    return;
  }

  const selectedSet = questionBank[category].sets[setName];

  if (!selectedSet || !selectedSet.questions.length) {
    alert("This question set is empty.");
    return;
  }

  raceLength = Number($("raceLength").value);
  currentPlayer = 0;
  questionIndex = 0;
  raceOver = false;
  gameStarted = true;

  createPlayers();
  questions = shuffle(selectedSet.questions);

  $("result").textContent = "";
  $("questionArea").classList.remove("hidden");
  $("turnLabel").textContent = "Race started!";
  $("diceMessage").textContent = "Answer the question to roll.";

  drawTrack();
  ();
  showTurn();

  // Collapse settings after starting the race.
  $("settingsContent").classList.add("hidden");
  $("settingsToggle").textContent = "⚙️ Settings";
  $("settingsToggle").setAttribute("aria-expanded", "false");
  $("settingsToggle").title = "Open race settings";
}

// SHOW CURRENT PLAYER
function showTurn() {
  if (raceOver) return;

  const player = players[currentPlayer];

  $("turnLabel").textContent =
    player.horse + " " + player.name + "'s turn!";

  loadQuestion();
  drawTrack();
  ();
}

// CHECK ANSWER
function submitAnswer() {
  if (!gameStarted || raceOver || canRoll) return;

  const q = questions[questionIndex - 1];
  const answer = $("answerInput").value.trim().toLowerCase();
  const correct = q.answer.trim().toLowerCase();

  if (!answer) {
    $("feedback").textContent = "Please type an answer first!";
    $("feedback").style.color = "#dc2626";
    return;
  }

  if (answer === correct) {
    $("feedback").textContent = "🎉 Correct! You can roll the dice!";
    $("feedback").style.color = "#16a34a";

    $("answerInput").disabled = true;
    $("submitAnswer").disabled = true;
    $("rollButton").disabled = false;

    $("diceMessage").textContent =
      players[currentPlayer].name + " has earned a dice roll!";

    canRoll = true;
  } else {
    $("feedback").textContent = "❌ Not quite! Correct answer: " + q.answer;
    $("feedback").style.color = "#dc2626";

    $("answerInput").disabled = true;
    $("submitAnswer").disabled = true;
    $("nextTurn").classList.remove("hidden");
  }
}

// ROLL DICE
function rollDice() {
  if (!canRoll || raceOver) return;

  canRoll = false;
  $("rollButton").disabled = true;

  const dice = $("dice");
  dice.classList.add("rolling");
  $("diceMessage").textContent = "The dice is rolling...";

  setTimeout(() => {
    const result = Math.floor(Math.random() * 6) + 1;

    dice.classList.remove("rolling");
    dice.textContent = diceFaces[result - 1];

    const player = players[currentPlayer];
    player.position += result;

    $("diceMessage").textContent =
      player.name + " rolled " + result + "!";

    drawTrack();
    ();

    if (player.position >= raceLength) {
      raceOver = true;
      $("result").textContent =
        "🏆 " + player.horse + " " + player.name + " WINS THE RACE! 🏆";

      $("turnLabel").textContent = "Race finished!";
      $("diceMessage").textContent = "Congratulations to the winner!";
      return;
    }

    $("feedback").textContent =
      "Your horse moved " + result + " spaces!";

    $("nextTurn").classList.remove("hidden");
  }, 1500);
}

// NEXT PLAYER
function nextPlayer() {
  if (!gameStarted || raceOver) return;

  currentPlayer = (currentPlayer + 1) % players.length;
  showTurn();
}

$("startButton").addEventListener("click", startRace);
$("submitAnswer").addEventListener("click", submitAnswer);
$("rollButton").addEventListener("click", rollDice);
$("nextTurn").addEventListener("click", nextPlayer);

$("answerInput").addEventListener("keydown", event => {
  if (event.key === "Enter") submitAnswer();
});

// COLLAPSIBLE SETTINGS BUTTON

const settingsToggle = $("settingsToggle");
const settingsContent = $("settingsContent");

settingsToggle.addEventListener("click", () => {
  const isOpen = !settingsContent.classList.contains("hidden");

  settingsContent.classList.toggle("hidden");

  settingsToggle.setAttribute("aria-expanded", String(!isOpen));

  settingsToggle.textContent = isOpen
    ? "⚙️ Settings"
    : "✖ Close Settings";

  settingsToggle.title = isOpen
    ? "Open race settings"
    : "Close race settings";
});

loadCategories();
</script>

</body>
</html>
